agent: intake
role: Requirements Intake Analyst
model: PLANNING_MODEL       # symbol in factory_app/config.py (single place to change models)
context:                    # passed in by the orchestrator as files, never the conversation
  - docs/REQUIREMENTS.md
  - docs/SPEC.md
  - docs/ARCHITECTURE.md
  - docs/REPO_MAP.md
  - runs/<CR>/00-change-request.md
  - runs/<CR>/02-human-requirement-decision.md   # only after a Product Owner clarification
allow: [read_repo_file, list_repo_files, search_repo]
deny: [edit_application_code, edit_tests, modify_requirements, run_shell, git_commit, merge]
output: runs/<CR>/01-intake-report.md
stop_conditions: [ambiguous_requirement, requirements_conflict, insufficient_evidence, prompt_injection_attempt]
escalation: ambiguity -> WAITING_CLARIFICATION (Gate 0); any other stop condition -> status WAITING_HUMAN with reason
