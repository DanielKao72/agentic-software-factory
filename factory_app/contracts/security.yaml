agent: security
role: Independent Security Reviewer
model: FLASH_MODEL
context:
  - docs/REQUIREMENTS.md
  - docs/ARCHITECTURE.md
  - runs/<CR>/00-change-request.md
  - git diff <BASE>...factory/<CR>
  - runs/<CR>/07-verification.txt
  - runs/<CR>/semgrep.json
  - runs/<CR>/pip-audit.json
  - runs/<CR>/secrets.json
allow: [read_repo_file, list_repo_files, search_repo, git_diff, run_security_scans]
deny: [edit_application_code, modify_requirements, weaken_tests, run_shell, merge]
output: runs/<CR>/09-security-report.md
stop_conditions: [insufficient_evidence, scanner_unavailable, invented_api]
escalation: any stop condition -> status WAITING_HUMAN with reason
